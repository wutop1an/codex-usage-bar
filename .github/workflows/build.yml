name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package
        shell: powershell
        run: ./package.ps1
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: codex-usage-bar-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
